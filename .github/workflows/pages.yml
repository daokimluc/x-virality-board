name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Enable GitHub Pages once::Open https://github.com/${{ github.repository }}/settings/pages → Source: Deploy from a branch → main → / (root) → Save. Or Source: GitHub Actions, then re-run this workflow. X brand: @lucdao2602"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
